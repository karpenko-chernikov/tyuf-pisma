name: Deploy to server

on:
  push:
    branches: [main]          # adjust if your default branch differs

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Write SSH kеy and pinned host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
              "$SSH_USER@$SSH_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /var/www/tyuf-pisma
          git fetch origin main
          git reset --hard origin/main
          docker build -t tyuf-pisma .
          docker stop tyuf-pisma 2>/dev/null || true
          docker rm   tyuf-pisma 2>/dev/null || true
          docker run --name tyuf-pisma \
            --restart unless-stopped \
            -p 127.0.0.1:8010:8000 \
            -v /var/www/tyuf-pisma/.env:/app/.env:ro \
            -v /var/www/tyuf-pisma/data:/app/data \
            -d tyuf-pisma
          docker image prune -f
          EOF